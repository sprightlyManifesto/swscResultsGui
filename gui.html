<!DOCTYPE html>
<html>
<title>Race</title>
<head>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="raceDetailsForm">
        <div><label for="raceDate">Date:</label><input type="date" id="raceDate"></div>
        <div><label for="raceNumber">Race Number:</label><input type="number" id="raceNumber" value=""></div>
        <div><label for="raceOfficer">Race Officer:</label><input type="text" id="raceOfficer" value=""></div>
        <div><label for="series">Series:</label><input type="text" id="series" value=""></div>
        <button onclick="createRace()">Create Race</button>
        <div><br><br></div>
        <button onclick="openRaceFileDialog()">re-open existing race</button>
    </div>
<div id="raceFileName"></div>
<div id="result">
    <div id="resultPY" style="width:49%;"></div>    
    <div style="width: 2%;"></div>
    <div id="resultPersonal" style="width:49%;"></div>
</div>
<div id="input">
    <button onclick="score()">Score</button>
    <table>
    <tr><th>QE</th><th>Helm</th><th>Crew</th><th>Class</th><th>Time</th><th>Laps</th><th>code</th></tr>
<tbody id="rows"></tbody>
</table>
<div class="button-bar">
<button onclick="addRow(null)">Add Entry</button>
</div>
<script>

document.getElementById("raceDetailsForm").style.display = "block";
document.getElementById("input").style.display = "none";

let raceFileName = "raceName"
let entries = [];
let QEsLoaded = false;
let QES = [];
let QESdict = new Map(); 
let handicaps = [];
let pyDict = new Map(); 

//set a default race Date
document.getElementById("raceDate").value =new Date().toISOString().split("T")[0];

window.addEventListener('pywebviewready', function () {
    api = pywebview.api;
    getQEs()
    getHandicaps()
});


  async function openRaceFileDialog() {
    const[fileName,contents] = await pywebview.api.getFile();
      if (fileName) {
    raceFileName = fileName;
    document.getElementById("raceDetailsForm").style.display = "none";
    document.getElementById("input").style.display = "block";
    setTitle()
    
   const lines = contents.split(/\r?\n/);

    for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        if (line.trim() === '<HANDICAPS>') {
            break;
        }
        toks = line.split(",");
        let entry = {
        QE : toks[0],
        helm: toks[1],
        crew: toks[2],
        boatClass: toks[3],
        time: toks[5],
        code: toks[7],
        laps: toks[6],
        }
        addRow(entry)
    }
    
    document.getElementById("raceDetailsForm").style.display = "none";
    document.getElementById("input").style.display = "block";
      }
}

function createRace() {
    // Read values
    let raceName = document.getElementById("series").value;
    let raceNumber = document.getElementById("raceNumber").value;
    let raceOfficer = document.getElementById("raceOfficer").value;
    let date = document.getElementById("raceDate").value;

    // Clean values
    function clean(value) {
        return value
            .replace(/\//g, "-")   // replace / with -
            .replace(/\s/g, "");    // remove all spaces
    }

    raceName = clean(raceName);
    raceOfficer = clean(raceOfficer);
    const [year, month, day] = date.split("-");
    const formattedDate = `${day}-${month}-${year}`;

    // Construct filename
    raceFileName = `${raceName}_${raceNumber}_${raceOfficer}_${formattedDate}.race`;

    document.getElementById("raceDetailsForm").style.display = "none";
    document.getElementById("input").style.display = "block";
    setTitle()
     //populate form with a selection of rows
    for(let i=0;i<26;i++){addRow(null)}
}

async function setTitle(params) {
    await pywebview.api.setTitle(raceFileName);
}

async function save(filname,fileString) {
    await pywebview.api.saveRaceFile(raceFileName,fileString);
}

async function getQEs() {
QES = await pywebview.api.QES();
QES.forEach( row => {
    QESdict.set(row.QE,row);
    });
    QEsLoaded = true;
}

async function getHandicaps() {
    
    //wait for QEsDict to be populated
    while(QEsLoaded != true){
        await new Promise(resolve => setTimeout(resolve, 100));
    }

    handicaps = await pywebview.api.handicaps();
    handicaps.forEach( row => {
         pyDict.set(row.boatClass,row.PY);
        });
}

function selectByText(select,text)
{
   for (const option of select.options) {

      if (option.text === text) {
        option.selected = true;
        break;
      }
    }
}

function TabulateResult()
{

entries.sort((a, b) => a.correctedTime - b.correctedTime);

let tableHtml = `<table><tr>
                <th>Class</th>
                <th>Helm and Crew</th>
                <th>Time</th>
                <th>laps</th>
                <th>Corrrected</th>
                <th>Place</th>
                </tr>`

entries.forEach((entry, index) => {
    let corrected = entry.correctedTime
    let i = 0;
    let place = 0
    let numberTied = 0
    
    //calculate place
    entries.forEach((element,n) => {
        if(entry.correctedTime == element.correctedTime)
        {
            numberTied += 1
            place += n +1
        }
    });
    entry.place = (parseFloat(place)/parseFloat(numberTied)).toFixed(1)
   
    let correctedTime = "" 
    if(!(entry.correctedTime == Infinity))
        {correctedTime = String(entry.correctedTime)}
    if(entry.code != "")
        {
            correctedTime=entry.code;
            entry.place = entries.length + 1
        }

    tableHtml += `<tr><td>${entry.boatClass}</td>
                <td><div style="white-space: nowrap;">${entry.helm} ${entry.crew}</div></td>
                <td>${entry.time}</td>
                <td>${entry.laps}</td>
                <td>${correctedTime}</td>
                <td>${entry.place}</td>
                </tr>` 
    });

    tableHtml += "</table>"
return tableHtml
}

function calculateCorrected(maxLaps,entry,personal)
{
entry.correctedTime = Infinity
    if(entry.time != 0 && entry.boatClass != "")
    {
        let handicap = parseFloat(pyDict.get(entry.boatClass))
        if(personal){
            if(QESdict.has(entry.QE)){
            handicap = (handicap * parseFloat(QESdict.get(entry.QE)["Personal"]))/1000
            }
            else{
            console.log(`${entry.QE} has not entry in QESdict`)
            }
        }
        entry.correctedTime = Math.round((entry.time*maxLaps*1000.0/entry.laps/handicap))
    }
    return entry.correctedTime
}

function score()
{
let rows = document.getElementsByClassName("inputRow")
entries = []

Array.from(rows).forEach(row => {
    let entry = {
    QE : row.getElementsByClassName("qe")[0].value,
    helm: row.getElementsByClassName("helm")[0].value,
    crew: row.getElementsByClassName("crew")[0].value,
    boatClass: row.getElementsByClassName("boatClass")[0].value,
    time: row.getElementsByClassName("time")[0].value,
    code: row.getElementsByClassName("code")[0].value,
    laps: row.getElementsByClassName("laps")[0].value,
    correctedTime :Infinity,
    place : rows.length +1,
    }

    if(!(entry.QE == "" && entry.helm == "" && entry.time == "" && entry.boatClass == ""))
    {
    entries.push(entry)
    }
});

maxLaps = 1
entries.forEach(entry => {
    if(entry.laps > maxLaps)
    {maxLaps = entry.laps}
});

entries.forEach(entry => {
    entry.correctedTime = calculateCorrected(maxLaps,entry,true)
});

let tableHtml = TabulateResult()
document.getElementById("resultPersonal").innerHTML = "<h2>Personal</h2>" + tableHtml

entries.forEach(entry => {
    entry.correctedTime = calculateCorrected(maxLaps,entry,false)
});
tableHtml = TabulateResult()

document.getElementById("resultPY").innerHTML = "<h2>PY</h2>" + tableHtml

//create Race file
raceString = raceFileName +"\n"
entries.forEach(entry =>{
    raceString += `${entry.QE},${entry.helm},${entry.crew},${entry.boatClass},,${entry.time},${entry.laps},,\n`
})

save(raceFileName,raceString)

}

function addRow(entry)
{

let classes = []
let tbody=document.getElementById("rows");
let tr=document.createElement("tr");
tr.className = "inputRow"
tr.innerHTML= `
<td><select class="qe"><option></option></td>
<td><input class="helm" onchange=""></td>
<td><input class="crew" onchange=""></td>
<td><select class="boatClass" onchange=""><option></option></select></td>
<td><input class="time" type="number" min="1" max="36000" step="1" onchange=""></td>
<td><input class="laps" type="number" min="1" max="100" step="1" onchange=""></td>
<td><select class="code" onchange="">
    <option></option>
    <option>DNF</option>
    <option>DNC</option>
    <option>OCS</option>
    <option>RTD</option>
    </select></td>
</td>
`;

tbody.appendChild(tr);

let boatClass = tr.getElementsByClassName("boatClass")[0]
let QESelect = tr.getElementsByClassName("qe")[0]
let helm = tr.getElementsByClassName("helm")[0]
let crew = tr.getElementsByClassName("crew")[0]
let code = tr.getElementsByClassName("code")[0]
let time = tr.getElementsByClassName("time")[0]
let laps = tr.getElementsByClassName("laps")[0]

handicaps.forEach(row => {
    let option = document.createElement("option")
    option.value = row["boatClass"]
    option.text = row["boatClass"]
    boatClass.appendChild(option);
});

QES.forEach(row => {
    let option = document.createElement("option")
    option.value = row["QE"]
    option.text = row["QE"] 
    QESelect.appendChild(option);
});

if(entry != null)
{
    boatClass.value = entry.boatClass;
    if(entry.QE != "")
        {
        QESelect.value = entry.QE;
        }
    helm.value = entry.helm
    crew.value = entry.crew
    code.value = entry.code
    time.value = entry.time
    laps.value = entry.laps
}

QESelect.addEventListener("change",  (event) => {
  const QEcode = event.target.value;
  if(QEcode != "")
  {
      QE = QESdict.get(QEcode);
      helm.value = QE.Helm;
      crew.value = QE.Crew;
      selectByText(boatClass,QE.boatClass)
  }
  else
  {
      helm.value = "";
      crew.value = "";
      selectByText(boatClass,"")
  }
})
}

function saveRow(button)
{
let row=button.closest("tr");
let entry={
qecode: row.querySelector(".qe").value,
helm: row.querySelector(".helm").value,
crew: row.querySelector(".crew").value || null,
boat_class: row.querySelector(".class").value,
sail_no: row.querySelector(".sail").value || null,

personal_handicap:
    Number(row.querySelector(".handicap").value),
age_group:
    row.querySelector(".age").value,
fleet:
    row.querySelector(".fleet").value
};

window.pywebview.api.save_entry(entry)
.then(result=>{
alert(result.message);
});
}

</script>
</body>
</html>
